<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6e8eb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Inner border -->
  <rect x="24" y="24" width="208" height="208" rx="40" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- 3D cube (isometric) -->
  <g transform="translate(128 128)" filter="url(#glow)">
    <!-- Top face -->
    <polygon points="0,-50 43,-25 0,0 -43,-25" fill="#ffffff" opacity="0.95"/>
    <!-- Left face -->
    <polygon points="-43,-25 0,0 0,50 -43,25" fill="#a0c8e8" opacity="0.9"/>
    <!-- Right face -->
    <polygon points="43,-25 0,0 0,50 43,25" fill="#7090c0" opacity="0.9"/>
    <!-- Edges -->
    <polyline points="0,-50 43,-25 0,0 -43,-25 0,-50" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-43" y2="25" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="0" y1="0" x2="43" y2="25" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>

  <!-- "1" badge (representing "All In ONE") -->
  <g transform="translate(196 60)">
    <circle cx="0" cy="0" r="22" fill="#fbbf24" stroke="#fff" stroke-width="2"/>
    <text x="0" y="6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="900" fill="#1a1a2e" text-anchor="middle">1</text>
  </g>

  <!-- 2D triangle accent (representing 2D engine) -->
  <g transform="translate(60 196)" opacity="0.85">
    <polygon points="0,-14 12,7 -12,7" fill="#ffffff"/>
  </g>

  <!-- Sparkles -->
  <circle cx="50" cy="60" r="3" fill="#fbbf24"/>
  <circle cx="206" cy="200" r="2.5" fill="#fbbf24"/>
  <circle cx="40" cy="140" r="2" fill="#fbbf24"/>

  <!-- Bottom brand strip -->
  <rect x="0" y="220" width="256" height="36" fill="rgba(0,0,0,0.25)"/>
  <text x="128" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ALL IN ONE</text>
</svg>
