<?xml version="1.0" encoding="UTF-8"?>
<!-- Pygame 2D Engine icon — a stylized "P" with a play triangle + pixel sprite -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#pgBg)"/>
  <rect x="12" y="12" width="104" height="104" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Pixel grid (subtle) -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="32" y1="24" x2="32" y2="104"/>
    <line x1="64" y1="24" x2="64" y2="104"/>
    <line x1="96" y1="24" x2="96" y2="104"/>
    <line x1="24" y1="32" x2="104" y2="32"/>
    <line x1="24" y1="64" x2="104" y2="64"/>
    <line x1="24" y1="96" x2="104" y2="96"/>
  </g>
  <!-- "P" letterform -->
  <path d="M 40 30 L 40 98 L 52 98 L 52 72 L 70 72 Q 88 72 88 51 Q 88 30 70 30 Z M 52 42 L 70 42 Q 76 42 76 51 Q 76 60 70 60 L 52 60 Z"
        fill="url(#pgP)" stroke="#93c5fd" stroke-width="1"/>
  <!-- Play triangle (interlocked) -->
  <path d="M 70 50 L 70 70 L 96 60 Z" fill="#fbbf24" opacity="0.95"/>
  <!-- Spark accents -->
  <circle cx="100" cy="34" r="2.5" fill="#fbbf24"/>
  <circle cx="28" cy="98" r="2" fill="#fbbf24"/>
</svg>
