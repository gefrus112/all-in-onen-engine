name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create .env for build
        run: |
          echo "DATABASE_URL=file:./dev.db" > .env
          echo "NEXTAUTH_SECRET=build-secret-not-used-in-static-export" >> .env
          echo "NEXTAUTH_URL=https://gefrus112.github.io/lapia-ai-agent" >> .env

      - name: Generate Prisma client
        run: bun run db:generate || true

      - name: Build static export
        run: bunx next build --webpack
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "build-secret-not-used-in-static-export"
          NEXTAUTH_URL: "https://gefrus112.github.io/lapia-ai-agent"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
