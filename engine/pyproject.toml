[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lapia"
version = "1.0.0"
description = "A batteries-included 2D game engine for Python built on Pygame"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "Lapia Engine Contributors"},
]
dependencies = [
    "pygame>=2.1.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "mypy>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/gefrus112/lapia-ai-agent"
"Repository" = "https://github.com/gefrus112/lapia-ai-agent"
"Bug Tracker" = "https://github.com/gefrus112/lapia-ai-agent/issues"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
